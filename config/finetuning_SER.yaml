# @package _group_

common:
  fp16: true
  log_format: json
  log_interval: 20
  tensorboard_logdir: tb
  fp16_no_flatten_grads: true
  seed: 3949

checkpoint:
  save_interval: 1
  save_interval_updates: 0
  keep_last_epochs: 1
  no_epoch_checkpoints: true
  best_checkpoint_metric: uar
  maximize_best_checkpoint_metric: true
  patience: -1

task:
  _name: mae_image_classification
  # Required: tools/ser_protocol.py sets this per dataset/fold.
  data: ???
  downsr_16hz: true
  audio_mae: true
  single_label: true
  # Required: tools/ser_protocol.py sets this per dataset.
  target_length: ???
  # Required: tools/ser_protocol.py sets the feature cache root.
  feature_cache_root: ???
  # audioset (EAT default) or fold (per-fold train statistics).
  norm_mode: audioset
  norm_stats_path: ""
  roll_aug: false
  noise: false
  h5_format: false
  AS2M_finetune: false
  spcv1_finetune: false
  spcv2_eval: false
  esc50_eval: false

dataset:
  num_workers: 6
  batch_size: 32
  skip_invalid_size_inputs_valid_test: true
  required_batch_size_multiple: 1
  train_subset: train
  valid_subset: valid
  disable_validation: false
  validate_interval: 1

distributed_training:
  distributed_world_size: 1
  ddp_backend: c10d

criterion:
  _name: model
  log_keys:
    - correct
    - _predictions
    - _targets

optimization:
  # The launcher overrides both fields from manifest samples and requested epochs.
  max_epoch: 80
  max_update: 0
  lr: [0.00005]

optimizer:
  _name: composite
  dynamic_groups: true
  groups:
    default:
      lr_float: 0.00005
      optimizer:
        _name: adam
        adam_betas: [0.9,0.95]
        weight_decay: 0.05
      lr_scheduler:
        _name: cosine
        # The launcher overrides this with 10% of the per-stage max updates.
        warmup_updates: 0
        min_lr: 1e-6

lr_scheduler: pass_through

model:
  _name: mae_image_classification
  # Required: tools/ser_protocol.py sets the pretrained checkpoint.
  model_path: ???
  audio_mae: true
  single_label: true
  # Required: tools/ser_protocol.py sets this per dataset.
  num_classes: ???
  prediction_mode: PredictionMode.CLS_TOKEN
  # Required: tools/ser_protocol.py sets this per dataset.
  target_length: ???
  mixup: 0.0
  specaug: false
  label_smoothing: 0.0
  spcv2_eval: false
  esc50_eval: false
